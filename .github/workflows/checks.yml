name: Application and database checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_inventory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pos_inventory_test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-public-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/test-db-local.mjs
      - run: node scripts/test-owner-controls-concurrency.mjs
      - name: Verify backup restoration and permissions
        run: |
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pos-postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/pos-postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pos-postgresql.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          POSTGRES_BIN=/usr/lib/postgresql/17/bin node scripts/test-restore-local.mjs
      - run: npm run build
